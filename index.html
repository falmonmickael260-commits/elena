<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24105c">
<meta name="description" content="Les Aventures d'Elena — un conte éducatif interactif.">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<title>Les Aventures d'Elena ✨</title>
</head>
<body>
<div id="app" aria-live="polite">
  <div id="loader" class="screen active">
    <div class="magic-sky"></div><div class="sparkles"></div>
    <div class="loader-art" role="img" aria-label="Elena dans un monde magique"></div>
    <div class="loader-bottom">
      <h1>✨ Les aventures d'Elena ✨</h1>
      <button id="startBtn" class="primary-btn">🌟 Commencer l'aventure 🌟</button>
    </div>
  </div>

  <div id="story" class="screen">
    <div class="story-bg"></div><div class="sparkles"></div>
    <div class="story-stage">
      <div id="storyCompanion" class="companion">🧚‍♀️</div>
      <div class="story-card"><div id="storyText"></div></div>
      <div class="story-controls">
        <button id="storyVoice" class="icon-btn">🔊</button>
        <button id="storyNext" class="primary-btn">✨ Continuer ✨</button>
      </div>
    </div>
  </div>

  <div id="map" class="screen">
    <header class="hud">
      <div class="hud-pill">⭐ <span id="stars">0</span></div>
      <div class="hud-title">🌈 Le monde d'Elena</div>
      <div class="hud-actions"><button id="mapVoice" class="icon-btn">🔊</button><button id="resetBtn" class="icon-btn">↻</button></div>
    </header>
    <div class="map-world" id="worldList"></div>
  </div>

  <div id="game" class="screen">
    <header class="hud">
      <button id="backMap" class="icon-btn">🗺️</button>
      <div class="hud-title" id="worldTitle">Aventure</div>
      <div class="hud-pill">⭐ <span id="gameStars">0</span></div>
    </header>
    <main class="game-area">
      <div class="game-progress"><span id="progressBar"></span></div>
      <div class="guide-row"><div id="gameCompanion" class="mini-companion">🧚‍♀️</div><button id="repeatBtn" class="icon-btn">🔊</button></div>
      <section class="question-card">
        <div id="questionVisual" class="question-visual"></div>
        <h2 id="questionText"></h2>
        <div id="answers" class="answers"></div>
      </section>
    </main>
  </div>

  <div id="door" class="screen door-screen">
    <div class="door-stars"></div>
    <div class="door-glow"></div>
    <div id="doorEmoji" class="door-emoji">🚪</div>
    <div class="magic-door"><div class="portal"></div><div class="door-left"></div><div class="door-right"></div></div>
    <h2 id="doorText">✨ Une nouvelle aventure t'attend !</h2>
  </div>

  <div id="ending" class="screen ending">
    <div class="sparkles"></div>
    <div class="ending-crystal">🌈</div>
    <h1>Le Cristal des Mondes est réparé !</h1>
    <p id="endingText"></p>
    <button id="endingMap" class="primary-btn">🗺️ Continuer l'aventure</button>
  </div>

  <div id="toast"></div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
